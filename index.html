<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sports Recorder & Live Score Overlay</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(15, 23, 42, 0.90);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-blue: #2563eb;
      --accent-cyan: #38bdf8;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #000;
    }

    /* Video Feed */
    #sourceVideo {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      object-fit: cover;
      z-index: 1;
    }

    /* Hidden CricClubs Live Iframe */
    #liveIframe {
      position: absolute;
      width: 1000px;
      height: 600px;
      top: -9999px; left: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    /* Rendering Canvas */
    #renderCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100dvh;
      object-fit: cover;
      z-index: 2;
    }

    /* Top Controls Header */
    .top-bar {
      position: relative;
      z-index: 20;
      width: calc(100% - 24px);
      margin-top: calc(10px + env(safe-area-inset-top));
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-weight: 800;
      font-size: 14px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls-group { display: flex; align-items: center; gap: 6px; }

    .btn, .select-input {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-record { background: var(--accent-red); border-color: transparent; color: #fff; }
    .btn-recording { animation: pulse 1.5s infinite; background: #b91c1c; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .url-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      width: 140px;
    }

    .rec-timer {
      font-family: monospace; font-size: 11px; font-weight: 700; color: #fff;
      background: rgba(239, 68, 68, 0.25); border: 1px solid var(--accent-red); padding: 4px 6px; border-radius: 6px;
      display: none;
    }

    /* Bottom Panel Container */
    .bottom-panel {
      position: relative;
      z-index: 20;
      width: 100vw;
      margin-bottom: env(safe-area-inset-bottom);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 0 12px 10px 12px;
    }

    .zoom-toolbar {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .zoom-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 5px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .zoom-btn.active { background: var(--accent-cyan); color: #0f172a; }
    .zoom-slider { width: 80px; accent-color: var(--accent-cyan); }

    /* Modal Overlay for File Export */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none;
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-card {
      background: var(--bg-dark); border: 1px solid var(--card-border); border-radius: 16px;
      padding: 16px; width: 90vw; max-width: 500px; display: flex; flex-direction: column; gap: 12px;
    }
    #previewVideo { width: 100%; max-height: 50vh; border-radius: 8px; background: #000; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <video id="sourceVideo" autoplay playsinline muted webkit-playsinline></video>
    <iframe id="liveIframe" src="about:blank"></iframe>
    <canvas id="renderCanvas"></canvas>

    <!-- Top Navigation Header -->
    <div class="top-bar">
      <div class="brand-title">
        <span style="color:#22c55e;">Live</span>Recorder
      </div>

      <div class="controls-group">
        <select id="cameraSelect" class="select-input"></select>
        
        <button class="btn" id="flipCamBtn" title="Switch Front/Rear">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8 8-3.582 8-8z"/>
            <polyline points="1 4 1 10 7 10"/>
            <polyline points="23 20 23 14 17 14"/>
          </svg>
        </button>

        <select id="resSelect" class="select-input">
          <option value="1080" selected>1080p</option>
          <option value="2160">4K (UHD)</option>
        </select>

        <select id="fpsSelect" class="select-input">
          <option value="30" selected>30 FPS</option>
          <option value="60">60 FPS</option>
        </select>
      </div>

      <div class="controls-group">
        <input type="text" id="overlayUrl" class="url-input" placeholder="Overlay URL..." />
        <button class="btn" id="loadUrlBtn">Load</button>
      </div>

      <div class="controls-group">
        <div id="recTimer" class="rec-timer">00:00:00</div>
        <button class="btn btn-record" id="recordBtn">
          <span id="recordText">Record</span>
        </button>
      </div>
    </div>

    <!-- Bottom Controls Bar -->
    <div class="bottom-panel">
      <div class="zoom-toolbar">
        <button class="zoom-btn active" onclick="setZoom(1)">1x</button>
        <button class="zoom-btn" onclick="setZoom(2)">2x</button>
        <button class="zoom-btn" onclick="setZoom(4)">4x</button>
        <button class="zoom-btn" onclick="setZoom(5)">5x (Tele)</button>
        <button class="zoom-btn" onclick="setZoom(10)">10x</button>
        <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="10" step="0.1" value="1">
        <span id="zoomVal" style="font-size: 11px; color: var(--text-muted);">1.0x</span>
      </div>
    </div>
  </div>

  <!-- Video Export Modal -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:16px; font-weight:700;">Recording Complete</span>
        <button class="btn" id="closeModalBtn">&times;</button>
      </div>
      <video id="previewVideo" controls></video>
      <div style="display:flex; gap:10px;">
        <a id="downloadBtn" class="btn btn-record" style="flex:1; text-align:center; text-decoration:none;" download>Save Video File</a>
      </div>
    </div>
  </div>

  <script>
    const sourceVideo = document.getElementById('sourceVideo');
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');
    const cameraSelect = document.getElementById('cameraSelect');
    const flipCamBtn = document.getElementById('flipCamBtn');
    const resSelect = document.getElementById('resSelect');
    const fpsSelect = document.getElementById('fpsSelect');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomVal = document.getElementById('zoomVal');
    const overlayUrlInput = document.getElementById('overlayUrl');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    const liveIframe = document.getElementById('liveIframe');
    const recordBtn = document.getElementById('recordBtn');
    const recordText = document.getElementById('recordText');
    const recTimer = document.getElementById('recTimer');
    const previewModal = document.getElementById('previewModal');
    const previewVideo = document.getElementById('previewVideo');
    const downloadBtn = document.getElementById('downloadBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let videoTrack = null;
    let currentFacingMode = "environment";
    let recStartTime = 0;
    let timerInterval = null;
    let wakeLock = null;

    // Live Match Data State
    let matchData = {
      teamA: "ASTROS+",
      scoreA: "133/10",
      oversA: "19.4",
      teamB: "MONEY HEIST",
      scoreB: "160/10",
      oversB: "19.1",
      batsman1: "Rajan J* 0 (4)",
      batsman2: "Vijaykumar P 1 (2)",
      partnership: "1 (3 balls)",
      lastWicket: "Rajan J 0(4) c Aditya Y b Snehith P",
      resultMsg: "Money Heist won by 27 Runs",
      recentBalls: ["W", "0", "1", "W"],
      isMatchOver: true
    };

    // Load Live Overlay URL
    loadUrlBtn.addEventListener('click', () => {
      const url = overlayUrlInput.value.trim();
      if (url) {
        liveIframe.src = url;
      }
    });

    // Enumerate Available Camera Lenses
    async function enumerateLenses() {
      try {
        await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoInputs = devices.filter(d => d.kind === 'videoinput');

        cameraSelect.innerHTML = '';
        videoInputs.forEach((device, i) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          
          let label = device.label || `Camera Lens ${i + 1}`;
          if (label.toLowerCase().includes('back') || label.toLowerCase().includes('rear')) {
            label = `Rear Lens ${i + 1}`;
          } else if (label.toLowerCase().includes('front')) {
            label = `Front Camera`;
          }
          option.text = label;
          cameraSelect.appendChild(option);
        });

        if (videoInputs.length > 0) {
          startCamera(videoInputs[0].deviceId);
        } else {
          startCamera(null);
        }
      } catch (err) {
        startCamera(null);
      }
    }

    flipCamBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      startCamera(null);
    });

    cameraSelect.addEventListener('change', () => {
      startCamera(cameraSelect.value);
    });

    async function startCamera(deviceId = null) {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      const resHeight = parseInt(resSelect.value) || 1080;
      const resWidth = resHeight === 2160 ? 3840 : 1920;
      const targetFps = parseInt(fpsSelect.value) || 30;

      const videoConstraints = deviceId ? 
        { deviceId: { exact: deviceId }, width: { ideal: resWidth }, height: { ideal: resHeight }, frameRate: { ideal: targetFps } } :
        { facingMode: { ideal: currentFacingMode }, width: { ideal: resWidth }, height: { ideal: resHeight }, frameRate: { ideal: targetFps } };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: true });
        sourceVideo.srcObject = mediaStream;
        await sourceVideo.play();
        videoTrack = mediaStream.getVideoTracks()[0];
      } catch (e) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          sourceVideo.srcObject = mediaStream;
          await sourceVideo.play();
          videoTrack = mediaStream.getVideoTracks()[0];
        } catch (err) {
          console.error("Camera access failed:", err);
        }
      }
    }

    async function setZoom(value) {
      zoomSlider.value = value;
      zoomVal.innerText = `${value.toFixed(1)}x`;

      document.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.classList.toggle('active', parseFloat(btn.innerText) === value);
      });

      if (videoTrack && videoTrack.applyConstraints) {
        try {
          await videoTrack.applyConstraints({ advanced: [{ zoom: value }] });
        } catch (e) {
          console.warn("Hardware zoom error:", e);
        }
      }
    }

    zoomSlider.addEventListener('input', () => setZoom(parseFloat(zoomSlider.value)));
    resSelect.addEventListener('change', () => startCamera(cameraSelect.value));
    fpsSelect.addEventListener('change', () => startCamera(cameraSelect.value));

    function resizeCanvas() {
      renderCanvas.width = window.innerWidth;
      renderCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Render Overlay Frame Loop
    function renderFrame() {
      const w = renderCanvas.width;
      const h = renderCanvas.height;

      // Draw Camera Feed
      if (sourceVideo.readyState >= sourceVideo.HAVE_CURRENT_DATA) {
        ctx.drawImage(sourceVideo, 0, 0, w, h);
      } else {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, w, h);
      }

      // Draw Top Resolution Header Tag
      ctx.fillStyle = '#ffffff';
      ctx.font = '11px monospace';
      ctx.fillText(`${resSelect.value === '2160' ? '3840x2160' : '1920x1080'} (${zoomSlider.value}x zoom) - Live Score`, 20, 30);

      // 1. MATCH RESULT OVERLAY CARD (If match is complete)
      if (matchData.isMatchOver) {
        const cardW = Math.min(360, w - 40);
        const cardH = 220;
        const cardX = (w - cardW) / 2;
        const cardY = (h - cardH) / 2 - 20;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 15;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.94)';
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 12);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('MATCH RESULT', cardX + cardW / 2, cardY + 28);

        // Divider
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.moveTo(cardX + 20, cardY + 36);
        ctx.lineTo(cardX + cardW - 20, cardY + 36);
        ctx.stroke();

        // Team B (Money Heist)
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(matchData.teamB, cardX + cardW / 2, cardY + 60);
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(matchData.scoreB, cardX + cardW / 2, cardY + 86);
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`(${matchData.oversB} ov)`, cardX + cardW / 2, cardY + 102);

        // Team A (Astros+)
        ctx.font = 'bold 16px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(matchData.teamA, cardX + cardW / 2, cardY + 126);
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(matchData.scoreA, cardX + cardW / 2, cardY + 152);
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`(${matchData.oversA} ov)`, cardX + cardW / 2, cardY + 168);

        // Winner Text
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#22c55e';
        ctx.fillText(matchData.resultMsg, cardX + cardW / 2, cardY + 194);
        ctx.restore();
      }

      // 2. BOTTOM MATCH TICKER BAR
      const barH = 50;
      const barY = h - barH - 60;
      const barX = 10;
      const barW = w - 20;

      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.beginPath();
      ctx.roundRect(barX, barY, barW, barH, 6);
      ctx.fill();

      // Left Team Badge (Blue Accent)
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(barX, barY, 70, barH);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ASTROS+', barX + 35, barY + 28);

      // Batsman Stats
      ctx.textAlign = 'left';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(matchData.batsman1, barX + 80, barY + 20);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(matchData.batsman2, barX + 80, barY + 38);

      // Center Score Pill
      const scorePillW = 100;
      const scorePillX = barX + (barW - scorePillW) / 2;
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(scorePillX, barY, scorePillW, barH);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(matchData.scoreA, scorePillX + scorePillW / 2, barY + 24);

      ctx.font = '10px sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`OVERS: ${matchData.oversA}`, scorePillX + scorePillW / 2, barY + 40);

      // Recent Ball Tracker Circles
      let ballX = scorePillX + scorePillW + 15;
      matchData.recentBalls.forEach(ball => {
        ctx.beginPath();
        ctx.arc(ballX, barY + 25, 10, 0, Math.PI * 2);
        ctx.fillStyle = ball === 'W' ? '#ef4444' : (ball === '4' || ball === '6' ? '#22c55e' : '#334155');
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ball, ballX, barY + 28);
        ballX += 24;
      });

      // Right Team Avatar Tag
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(matchData.teamB, barX + barW - 15, barY + 28);

      ctx.restore();

      requestAnimationFrame(renderFrame);
    }

    // Timer Formatter
    function updateTimer() {
      const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
      const hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      recTimer.innerText = `${hrs}:${mins}:${secs}`;
    }

    // Recording Controls
    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        recordedChunks = [];
        const canvasStream = renderCanvas.captureStream(parseInt(fpsSelect.value) || 30);
        if (mediaStream && mediaStream.getAudioTracks().length > 0) {
          canvasStream.addTrack(mediaStream.getAudioTracks()[0]);
        }

        if ('wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

        mediaRecorder.onstop = () => {
          if (wakeLock) { wakeLock.release(); wakeLock = null; }
          clearInterval(timerInterval);
          recTimer.style.display = 'none';

          const recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
          const videoUrl = URL.createObjectURL(recordedBlob);
          previewVideo.src = videoUrl;

          const fileName = `match-recording-${Date.now()}.webm`;
          downloadBtn.href = videoUrl;
          downloadBtn.download = fileName;

          previewModal.style.display = 'flex';
        };

        mediaRecorder.start(5000);
        isRecording = true;
        recStartTime = Date.now();
        recTimer.style.display = 'block';
        timerInterval = setInterval(updateTimer, 1000);

        recordBtn.classList.add('btn-recording');
        recordText.innerText = 'Stop';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('btn-recording');
        recordText.innerText = 'Record';
      }
    });

    closeModalBtn.addEventListener('click', () => previewModal.style.display = 'none');

    enumerateLenses();
    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
