<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Recorder - 4K & 1080p Lens Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-blue: #38bdf8;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Main Viewport Container */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #000;
    }

    #sourceVideo, #hiddenIframe {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }

    #renderCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Glassmorphism Controls Panel */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
    }

    .zoom-btn {
      transition: all 0.15s ease-in-out;
    }

    .zoom-btn.active {
      background-color: var(--accent-blue);
      color: #0f172a;
      font-weight: 700;
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .btn-recording {
      animation: pulse-red 1.5s infinite;
      background-color: var(--accent-red) !important;
      color: white !important;
    }

    @keyframes pulse-red {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Custom Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      height: 6px;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: var(--accent-blue);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="relative bg-black text-white w-screen h-screen overflow-hidden">

  <div class="app-viewport">
    
    <!-- Hidden Raw Camera Video Element -->
    <video id="sourceVideo" autoplay playsinline muted webkit-playsinline></video>
    <iframe id="hiddenIframe" src="about:blank"></iframe>

    <!-- Main Live Composite Canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- Top Floating Toolbar -->
    <div class="absolute top-3 left-3 right-3 glass-panel rounded-2xl p-2.5 sm:p-3 flex flex-wrap items-center justify-between gap-2 z-20 shadow-2xl">
      
      <!-- Camera Flip & Brand Logo -->
      <div class="flex items-center gap-2">
        <button id="flipCamBtn" title="Switch Front/Rear Camera" class="bg-slate-800/80 hover:bg-slate-700/80 border border-slate-600 text-white p-2 rounded-xl flex items-center justify-center transition-all">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8 3.582 8 8 8-3.582 8-8z"/>
            <polyline points="1 4 1 10 7 10"/>
            <polyline points="23 20 23 14 17 14"/>
          </svg>
        </button>
        <div class="flex items-center gap-2 px-1">
          <div class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></div>
          <span class="font-bold text-xs sm:text-sm tracking-wide hidden sm:inline">MatchRecorder Pro</span>
        </div>
      </div>

      <!-- Resolution Selector, FPS Selector & Timer -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- 4K vs 1080p Dropdown -->
        <select id="resSelect" class="bg-slate-800/90 border border-slate-600 text-xs text-white rounded-lg px-2 py-1.5 focus:outline-none focus:border-sky-400 font-semibold">
          <option value="1080" selected>1080p (FHD)</option>
          <option value="2160">4K (UHD)</option>
        </select>

        <!-- FPS Selector Dropdown -->
        <select id="fpsSelect" class="bg-slate-800/90 border border-slate-600 text-xs text-white rounded-lg px-2 py-1.5 focus:outline-none focus:border-sky-400 font-semibold">
          <option value="30">30 FPS</option>
          <option value="60" selected>60 FPS</option>
        </select>

        <!-- Recording Duration Clock Badge -->
        <div id="recTimer" class="hidden font-mono text-xs font-bold text-red-400 bg-red-950/80 border border-red-500/50 px-2 py-1 rounded-lg">
          00:00:00
        </div>
      </div>

      <!-- Record Output Action Button -->
      <div class="flex items-center gap-2">
        <button id="recordBtn" class="bg-red-600 hover:bg-red-700 text-white font-semibold text-xs sm:text-sm px-3.5 py-1.5 rounded-xl flex items-center gap-1.5 transition-all shadow-md">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
          <span id="recordText">Record</span>
        </button>
      </div>
    </div>

    <!-- Floating Hardware Zoom Control Bar -->
    <div class="absolute bottom-5 left-1/2 transform -translate-x-1/2 glass-panel rounded-2xl p-3 sm:p-4 w-[92%] max-w-lg flex flex-col gap-2 z-20 shadow-2xl">
      
      <!-- Quick-Zoom Preset Buttons -->
      <div class="flex items-center justify-between gap-1.5">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider hidden sm:inline">Presets:</span>
        <div class="flex items-center justify-between w-full sm:w-auto gap-1.5 flex-1">
          <button class="zoom-btn active flex-1 sm:flex-initial bg-slate-800/90 border border-slate-700 hover:border-sky-400 text-xs font-bold py-1.5 px-2.5 rounded-lg text-center" data-zoom="1.0">1x</button>
          <button class="zoom-btn flex-1 sm:flex-initial bg-slate-800/90 border border-slate-700 hover:border-sky-400 text-xs font-bold py-1.5 px-2.5 rounded-lg text-center" data-zoom="2.0">2x</button>
          <button class="zoom-btn flex-1 sm:flex-initial bg-slate-800/90 border border-slate-700 hover:border-sky-400 text-xs font-bold py-1.5 px-2.5 rounded-lg text-center" data-zoom="4.0">4x</button>
          <button class="zoom-btn flex-1 sm:flex-initial bg-slate-800/90 border border-slate-700 hover:border-sky-400 text-xs font-bold py-1.5 px-2.5 rounded-lg text-center" data-zoom="5.0">5x (Tele)</button>
          <button class="zoom-btn flex-1 sm:flex-initial bg-slate-800/90 border border-slate-700 hover:border-sky-400 text-xs font-bold py-1.5 px-2.5 rounded-lg text-center" data-zoom="10.0">10x</button>
        </div>
      </div>

      <!-- Continuous Zoom Slider -->
      <div class="flex items-center gap-3 pt-1">
        <span class="text-xs text-slate-300 font-medium w-8">Zoom</span>
        <input type="range" id="zoomSlider" class="flex-1 cursor-pointer" min="1" max="10" step="0.1" value="1">
        <span id="zoomVal" class="text-xs font-mono font-bold text-sky-400 w-12 text-right">1.0x</span>
      </div>
    </div>

    <!-- Export Recorded File Modal -->
    <div id="previewModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex justify-center items-center p-4 z-50">
      <div class="glass-panel bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-xl w-full flex flex-col gap-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
          <div>
            <h3 class="text-base font-bold text-white">Match Recording Complete</h3>
            <p id="recordedMeta" class="text-xs text-slate-400">Resolution: 1080p | 60 FPS</p>
          </div>
          <button id="closeModalBtn" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
        </div>
        
        <video id="previewVideo" controls class="w-full max-h-[50vh] rounded-xl bg-black object-contain"></video>
        
        <div class="flex justify-end gap-3 pt-1">
          <a id="downloadBtn" href="#" download class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition-all shadow-lg flex items-center gap-2 text-decoration-none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save Video File
          </a>
        </div>
      </div>
    </div>

  </div>

  <script>
    const sourceVideo = document.getElementById('sourceVideo');
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');
    const flipCamBtn = document.getElementById('flipCamBtn');
    const resSelect = document.getElementById('resSelect');
    const fpsSelect = document.getElementById('fpsSelect');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomVal = document.getElementById('zoomVal');
    const zoomBtns = document.querySelectorAll('.zoom-btn');
    const recordBtn = document.getElementById('recordBtn');
    const recordText = document.getElementById('recordText');
    const recTimer = document.getElementById('recTimer');
    const previewModal = document.getElementById('previewModal');
    const previewVideo = document.getElementById('previewVideo');
    const downloadBtn = document.getElementById('downloadBtn');
    const recordedMeta = document.getElementById('recordedMeta');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let videoTrack = null;
    let currentFacingMode = "environment"; // Default rear camera
    let recStartTime = 0;
    let timerInterval = null;
    let wakeLock = null;

    // Live Scorecard Overlay State
    const overlayState = {
      teamA: "LIONS CC",
      scoreA: "184/5",
      oversA: "19.4",
      batsmanA: "V. Kohli*",
      runsA: "82 (53)"
    };

    async function startCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      const is4K = resSelect.value === "2160";
      const targetWidth = is4K ? 3840 : 1920;
      const targetHeight = is4K ? 2160 : 1080;
      const targetFps = parseInt(fpsSelect.value) || 60;

      const constraints = {
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: targetWidth },
          height: { ideal: targetHeight },
          frameRate: { ideal: targetFps }
        },
        audio: true
      };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        console.warn("Strict resolution request failed, falling back to ideal camera constraints:", err);
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacingMode },
            audio: true
          });
        } catch (finalErr) {
          console.error("Camera access completely denied:", finalErr);
          return;
        }
      }

      sourceVideo.srcObject = mediaStream;
      await sourceVideo.play().catch(e => console.warn("Video play exception handled:", e));

      videoTrack = mediaStream.getVideoTracks()[0];

      // Bind Hardware Continuous Zoom capability if provided by OS driver
      if (videoTrack && videoTrack.getCapabilities) {
        const capabilities = videoTrack.getCapabilities();
        if (capabilities.zoom) {
          zoomSlider.min = capabilities.zoom.min || 1;
          zoomSlider.max = capabilities.zoom.max || 10;
          zoomSlider.step = capabilities.zoom.step || 0.1;
          
          const currentZoom = videoTrack.getSettings().zoom || 1;
          setZoomValue(currentZoom, false);
          zoomSlider.disabled = false;
        }
      }
    }

    async function applyHardwareZoom(value) {
      if (videoTrack && videoTrack.applyConstraints) {
        try {
          await videoTrack.applyConstraints({ advanced: [{ zoom: value }] });
        } catch (e) {
          console.warn("Hardware zoom constraints error:", e);
        }
      }
    }

    function setZoomValue(value, triggerHardware = true) {
      const numValue = parseFloat(value);
      zoomSlider.value = numValue;
      zoomVal.innerText = `${numValue.toFixed(1)}x`;

      zoomBtns.forEach(btn => {
        const btnVal = parseFloat(btn.dataset.zoom);
        if (Math.abs(btnVal - numValue) < 0.15) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (triggerHardware) {
        applyHardwareZoom(numValue);
      }
    }

    // Event Listeners for Controls
    flipCamBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      startCamera();
    });

    resSelect.addEventListener('change', () => startCamera());
    fpsSelect.addEventListener('change', () => startCamera());

    zoomSlider.addEventListener('input', (e) => setZoomValue(e.target.value, true));
    zoomBtns.forEach(btn => {
      btn.addEventListener('click', () => setZoomValue(parseFloat(btn.dataset.zoom), true));
    });

    function resizeCanvas() {
      renderCanvas.width = window.innerWidth * (window.devicePixelRatio || 1);
      renderCanvas.height = window.innerHeight * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderFrame() {
      const width = renderCanvas.width;
      const height = renderCanvas.height;

      // 1. Draw raw video stream
      if (sourceVideo.readyState >= sourceVideo.HAVE_CURRENT_DATA && !sourceVideo.paused) {
        ctx.drawImage(sourceVideo, 0, 0, width, height);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);
      }

      // 2. Draw Dynamic Transparent Scorecard Overlay
      const scale = (window.devicePixelRatio || 1);
      const cardW = Math.min(380 * scale, width - (40 * scale));
      const cardH = 80 * scale;
      const cardX = 20 * scale;
      const cardY = height - cardH - (110 * scale);

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 12 * scale;

      // Background Card Box
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 12 * scale);
      ctx.fill();

      // Border Outline
      ctx.lineWidth = 1.2 * scale;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.textAlign = 'left';

      // Team Name
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${15 * scale}px -apple-system, sans-serif`;
      ctx.fillText(overlayState.teamA, cardX + (16 * scale), cardY + (30 * scale));

      // Main Score
      ctx.fillStyle = '#38bdf8';
      ctx.font = `bold ${22 * scale}px -apple-system, sans-serif`;
      ctx.fillText(overlayState.scoreA, cardX + (16 * scale), cardY + (62 * scale));

      // Overs Detail
      ctx.fillStyle = '#94a3b8';
      ctx.font = `500 ${13 * scale}px -apple-system, sans-serif`;
      ctx.fillText(`Overs: ${overlayState.oversA}`, cardX + (150 * scale), cardY + (62 * scale));

      // Batsman Detail
      ctx.fillStyle = '#f8fafc';
      ctx.font = `500 ${13 * scale}px -apple-system, sans-serif`;
      ctx.fillText(overlayState.batsmanA, cardX + (150 * scale), cardY + (30 * scale));

      // Live Badge
      const badgeX = cardX + cardW - (68 * scale);
      const badgeY = cardY + (16 * scale);
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.roundRect(badgeX, badgeY, 52 * scale, 20 * scale, 4 * scale);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${10 * scale}px -apple-system, sans-serif`;
      ctx.fillText('LIVE', badgeX + (14 * scale), badgeY + (14 * scale));

      ctx.restore();

      requestAnimationFrame(renderFrame);
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
      const hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      recTimer.innerText = `${hrs}:${mins}:${secs}`;
    }

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        recordedChunks = [];
        const targetFps = parseInt(fpsSelect.value) || 60;
        const canvasStream = renderCanvas.captureStream(targetFps);

        if (mediaStream && mediaStream.getAudioTracks().length > 0) {
          canvasStream.addTrack(mediaStream.getAudioTracks()[0]);
        }

        // Prevent Mobile Screen Sleep during long match recordings
        if ('wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }

        const options = { mimeType: 'video/webm;codecs=vp9,opus' };
        try {
          mediaRecorder = new MediaRecorder(canvasStream, options);
        } catch (e) {
          mediaRecorder = new MediaRecorder(canvasStream);
        }

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          if (wakeLock) { wakeLock.release(); wakeLock = null; }
          clearInterval(timerInterval);
          recTimer.classList.add('hidden');

          const recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
          const videoUrl = URL.createObjectURL(recordedBlob);
          previewVideo.src = videoUrl;

          const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
          downloadBtn.href = videoUrl;
          downloadBtn.download = `match-recording-${resSelect.value}p-${timestamp}.webm`;
          
          recordedMeta.innerText = `Resolution: ${resSelect.value === "2160" ? "4K (2160p)" : "1080p (FHD)"} | ${fpsSelect.value} FPS`;

          previewModal.classList.remove('hidden');
        };

        // Collect timesliced data chunks every 5000ms (5s) for smooth memory handling
        mediaRecorder.start(5000);
        isRecording = true;
        recStartTime = Date.now();
        recTimer.classList.remove('hidden');
        timerInterval = setInterval(updateTimer, 1000);

        recordBtn.classList.add('btn-recording');
        recordText.innerText = 'Stop';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('btn-recording');
        recordText.innerText = 'Record';
      }
    });

    closeModalBtn.addEventListener('click', () => {
      previewModal.classList.add('hidden');
    });

    startCamera();
    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
