<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sports Match Recorder</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-blue: #38bdf8;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #000;
    }

    #sourceVideo {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }

    #renderCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
    }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 20;
      width: calc(100% - 24px);
      margin-top: calc(12px + env(safe-area-inset-top));
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .controls-group { display: flex; align-items: center; gap: 6px; }

    .btn, .select-input {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-record { background: var(--accent-red); border-color: transparent; color: #fff; }
    .btn-recording { animation: pulse 1.5s infinite; background: #b91c1c; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .url-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      width: 110px;
    }

    .rec-timer {
      font-family: monospace; font-size: 11px; font-weight: 700; color: #fff;
      background: rgba(239, 68, 68, 0.25); border: 1px solid var(--accent-red); padding: 4px 6px; border-radius: 6px;
      display: none;
    }

    /* Bottom Section */
    .bottom-controls-panel {
      position: relative;
      z-index: 20;
      width: calc(100% - 24px);
      margin-bottom: calc(12px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .zoom-toolbar {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .zoom-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }

    .zoom-btn.active { background: var(--accent-blue); color: #0f172a; }
    .zoom-slider { width: 80px; accent-color: var(--accent-blue); }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none;
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-card {
      background: var(--bg-dark); border: 1px solid var(--card-border); border-radius: 16px;
      padding: 16px; width: 90vw; max-width: 500px; display: flex; flex-direction: column; gap: 12px;
    }
    #previewVideo { width: 100%; max-height: 50vh; border-radius: 8px; background: #000; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <video id="sourceVideo" autoplay playsinline muted webkit-playsinline></video>
    <canvas id="renderCanvas"></canvas>

    <div class="top-bar">
      <div class="controls-group">
        <button class="btn" id="flipCamBtn" title="Switch Camera">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8 3.582 8 8 8-3.582 8-8z"/>
            <polyline points="1 4 1 10 7 10"/>
            <polyline points="23 20 23 14 17 14"/>
          </svg>
        </button>

        <select id="resSelect" class="select-input">
          <option value="1080" selected>1080p</option>
          <option value="2160">4K (UHD)</option>
        </select>

        <select id="fpsSelect" class="select-input">
          <option value="30" selected>30 FPS</option>
          <option value="60">60 FPS</option>
        </select>
      </div>

      <div class="controls-group">
        <input type="text" id="overlayUrl" class="url-input" placeholder="Overlay URL..." />
        <button class="btn" id="loadUrlBtn">Load</button>
      </div>

      <div class="controls-group">
        <div id="recTimer" class="rec-timer">00:00:00</div>
        <button class="btn btn-record" id="recordBtn">
          <span id="recordText">Record</span>
        </button>
      </div>
    </div>

    <!-- Bottom Panel -->
    <div class="bottom-controls-panel">
      <div class="zoom-toolbar">
        <button class="zoom-btn active" onclick="setZoom(1)">1x</button>
        <button class="zoom-btn" onclick="setZoom(2)">2x</button>
        <button class="zoom-btn" onclick="setZoom(4)">4x</button>
        <button class="zoom-btn" onclick="setZoom(5)">5x</button>
        <button class="zoom-btn" onclick="setZoom(10)">10x</button>
        <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="10" step="0.1" value="1">
        <span id="zoomVal" style="font-size: 11px; color: var(--text-muted);">1.0x</span>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:16px; font-weight:700;">Recording Complete</span>
        <button class="btn" id="closeModalBtn">&times;</button>
      </div>
      <video id="previewVideo" controls></video>
      <div style="display:flex; gap:10px;">
        <a id="downloadBtn" class="btn btn-record" style="flex:1; text-align:center; text-decoration:none;" download>Save Video to Storage</a>
      </div>
    </div>
  </div>

  <script>
    const sourceVideo = document.getElementById('sourceVideo');
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');
    const flipCamBtn = document.getElementById('flipCamBtn');
    const resSelect = document.getElementById('resSelect');
    const fpsSelect = document.getElementById('fpsSelect');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomVal = document.getElementById('zoomVal');
    const recordBtn = document.getElementById('recordBtn');
    const recordText = document.getElementById('recordText');
    const recTimer = document.getElementById('recTimer');
    const previewModal = document.getElementById('previewModal');
    const previewVideo = document.getElementById('previewVideo');
    const downloadBtn = document.getElementById('downloadBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let videoTrack = null;
    let currentFacingMode = "environment";
    let recStartTime = 0;
    let timerInterval = null;
    let wakeLock = null;

    let overlayState = { teamA: "LIONS CC", scoreA: "184/5", oversA: "19.4" };

    flipCamBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      startCamera();
    });

    async function startCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      const resHeight = parseInt(resSelect.value) || 1080;
      const resWidth = resHeight === 2160 ? 3840 : 1920;
      const targetFps = parseInt(fpsSelect.value) || 30;

      // Soft constraints to prevent device OverconstrainedError crashes
      const constraintOptions = [
        {
          video: {
            facingMode: { ideal: currentFacingMode },
            width: { ideal: resWidth },
            height: { ideal: resHeight },
            frameRate: { ideal: targetFps }
          },
          audio: true
        },
        {
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: true
        },
        { video: true, audio: true }
      ];

      for (let constraints of constraintOptions) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
          sourceVideo.srcObject = mediaStream;
          await sourceVideo.play();
          videoTrack = mediaStream.getVideoTracks()[0];
          break;
        } catch (e) {
          console.warn("Camera fallback triggered:", e);
        }
      }
    }

    async function setZoom(value) {
      zoomSlider.value = value;
      zoomVal.innerText = `${value.toFixed(1)}x`;

      document.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.classList.toggle('active', parseFloat(btn.innerText) == value);
      });

      if (videoTrack && videoTrack.applyConstraints) {
        try {
          await videoTrack.applyConstraints({ advanced: [{ zoom: value }] });
        } catch (e) {
          console.warn("Hardware zoom warning:", e);
        }
      }
    }

    zoomSlider.addEventListener('input', () => setZoom(parseFloat(zoomSlider.value)));
    resSelect.addEventListener('change', () => startCamera());
    fpsSelect.addEventListener('change', () => startCamera());

    function resizeCanvas() {
      renderCanvas.width = window.innerWidth;
      renderCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderFrame() {
      const width = renderCanvas.width;
      const height = renderCanvas.height;

      if (sourceVideo.readyState >= sourceVideo.HAVE_CURRENT_DATA) {
        ctx.drawImage(sourceVideo, 0, 0, width, height);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);
      }

      // Live Overlay
      const cardW = Math.min(320, width - 40);
      const cardH = 70;
      const cardX = 20;
      const cardY = height - cardH - 80;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 10);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(overlayState.teamA, cardX + 14, cardY + 28);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(overlayState.scoreA, cardX + 14, cardY + 54);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 13px sans-serif';
      ctx.fillText(`Overs: ${overlayState.oversA}`, cardX + 140, cardY + 54);

      ctx.restore();
      requestAnimationFrame(renderFrame);
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
      const hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      recTimer.innerText = `${hrs}:${mins}:${secs}`;
    }

    recordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        recordedChunks = [];
        const canvasStream = renderCanvas.captureStream(parseInt(fpsSelect.value) || 30);
        if (mediaStream && mediaStream.getAudioTracks().length > 0) {
          canvasStream.addTrack(mediaStream.getAudioTracks()[0]);
        }

        if ('wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

        mediaRecorder.onstop = () => {
          if (wakeLock) { wakeLock.release(); wakeLock = null; }
          clearInterval(timerInterval);
          recTimer.style.display = 'none';

          const recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
          const videoUrl = URL.createObjectURL(recordedBlob);
          previewVideo.src = videoUrl;

          const fileName = `match-recording-${Date.now()}.webm`;
          downloadBtn.href = videoUrl;
          downloadBtn.download = fileName;

          previewModal.style.display = 'flex';
        };

        mediaRecorder.start(5000);
        isRecording = true;
        recStartTime = Date.now();
        recTimer.style.display = 'block';
        timerInterval = setInterval(updateTimer, 1000);

        recordBtn.classList.add('btn-recording');
        recordText.innerText = 'Stop';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('btn-recording');
        recordText.innerText = 'Record';
      }
    });

    closeModalBtn.addEventListener('click', () => previewModal.style.display = 'none');

    startCamera();
    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
