<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricket Match Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* Top Control Bar with Zoom Controls Included */
    .top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: none;
      gap: 8px;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .left-controls, .right-controls {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn, select.btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      outline: none;
    }

    .btn-icon {
      padding: 6px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-toggle.active {
      background: rgba(16, 185, 129, 0.85);
      border-color: #34d399;
    }

    .btn-toggle.inactive {
      background: rgba(239, 68, 68, 0.85);
      border-color: #f87171;
    }

    /* Top Bar Integrated Zoom Bar */
    .zoom-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 4px 8px;
      backdrop-filter: blur(8px);
    }

    .zoom-presets {
      display: flex;
      gap: 2px;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 4px 6px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    .zoom-slider-container {
      display: flex;
      align-items: center;
      gap: 4px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      padding-left: 6px;
    }

    .zoom-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 70px;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      outline: none;
    }

    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }

    #zoom-label {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      min-width: 28px;
    }

    .record-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
      cursor: pointer;
    }

    .record-btn.recording {
      background: #dc2626;
      animation: pulse 1.5s infinite;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Scorecard Overlay Box */
    #overlay-wrapper {
      position: absolute;
      z-index: 30;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    /* Landscape Scorecard Positioning and Scaling */
    @media (orientation: landscape) {
      #overlay-wrapper {
        top: 54px;
        left: 10px;
        width: 480px;
        height: 140px;
        transform-origin: top left;
        transform: scale(0.85);
      }
    }

    /* Portrait Scorecard Positioning */
    @media (orientation: portrait) {
      #overlay-wrapper {
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100vw - 20px);
        height: 110px;
      }
    }

    #overlay-wrapper.hidden {
      display: none;
    }

    #overlay-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    #status-banner {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      color: #aaa;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Camera Feed -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Top Controls Bar -->
    <div class="top-bar">
      <div class="left-controls">
        <!-- Toggle Scorecard ON/OFF -->
        <button id="toggle-overlay-btn" class="btn btn-toggle active" onclick="toggleScorecard()">
          <span>Scorecard: ON</span>
        </button>

        <!-- Flip Camera Quick Icon Button -->
        <button class="btn btn-icon" onclick="switchCameraLens()" title="Switch Front/Back Lens">
          <svg viewBox="0 0 24 24">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>

        <!-- Top Bar Zoom Options -->
        <div class="zoom-group">
          <div class="zoom-presets">
            <button class="zoom-btn active" data-zoom="1" onclick="applyZoom(1, this)">1x</button>
            <button class="zoom-btn" data-zoom="2" onclick="applyZoom(2, this)">2x</button>
            <button class="zoom-btn" data-zoom="4" onclick="applyZoom(4, this)">4x</button>
            <button class="zoom-btn" data-zoom="5" onclick="applyZoom(5, this)">5x</button>
            <button class="zoom-btn" data-zoom="10" onclick="applyZoom(10, this)">10x</button>
          </div>
          <div class="zoom-slider-container">
            <input 
              type="range" 
              id="zoom-slider" 
              class="zoom-slider" 
              min="1" 
              max="10" 
              step="0.1" 
              value="1" 
              oninput="onSliderInput(this.value)"
            >
            <span id="zoom-label">1.0x</span>
          </div>
        </div>

        <!-- Resolution Selector -->
        <select id="resolution-select" class="btn" onchange="changeResolution(this.value)">
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="2160">4K</option>
        </select>

        <!-- FPS Selector -->
        <select id="fps-select" class="btn" onchange="changeFPS(this.value)">
          <option value="30">30 FPS</option>
          <option value="60">60 FPS</option>
          <option value="24">24 FPS</option>
        </select>
      </div>

      <div class="right-controls">
        <!-- Record Button -->
        <button id="record-btn" class="record-btn" onclick="toggleRecording()">
          <span class="rec-dot"></span>
          <span id="record-text">REC</span>
        </button>
      </div>
    </div>

    <!-- Embedded Scorecard Overlay -->
    <div id="overlay-wrapper">
      <iframe 
        id="overlay-frame" 
        src="https://cricclubs.com/nacltennisballcricket/overlay.do?matchId=4608&clubId=27594"
        allow="autoplay"
      ></iframe>
    </div>

    <div id="status-banner">Ready</div>
  </div>

  <script>
    let videoTrack = null;
    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let currentFacingMode = 'environment';
    let currentResHeight = 1080;
    let currentFps = 30;
    let isOverlayVisible = true;
    let timerInterval = null;
    let recordSeconds = 0;
    let currentZoom = 1;

    const videoEl = document.getElementById('camera-feed');
    const recordBtn = document.getElementById('record-btn');
    const recordText = document.getElementById('record-text');
    const overlayWrapper = document.getElementById('overlay-wrapper');
    const toggleOverlayBtn = document.getElementById('toggle-overlay-btn');
    const zoomSlider = document.getElementById('zoom-slider');
    const zoomLabel = document.getElementById('zoom-label');
    const statusBanner = document.getElementById('status-banner');

    function updateStatus(msg) {
      statusBanner.innerText = msg;
    }

    async function initCamera() {
      updateStatus('Initializing camera...');
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      const videoConstraints = {
        facingMode: { ideal: currentFacingMode },
        height: { ideal: currentResHeight },
        width: { ideal: Math.round(currentResHeight * (16 / 9)) },
        frameRate: { ideal: currentFps },
        zoom: true
      };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: true
        });

        videoEl.srcObject = mediaStream;
        videoTrack = mediaStream.getVideoTracks()[0];
        
        if (videoTrack && typeof videoTrack.getCapabilities === 'function') {
          const capabilities = videoTrack.getCapabilities();
          if (capabilities.zoom) {
            zoomSlider.min = capabilities.zoom.min || 1;
            zoomSlider.max = Math.min(capabilities.zoom.max || 10, 10);
          }
        }

        updateStatus('Camera Ready');
        applyZoom(currentZoom);
      } catch (err) {
        console.warn('Init with zoom flag failed, attempting standard constraints:', err);
        delete videoConstraints.zoom;
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: true });
          videoEl.srcObject = mediaStream;
          videoTrack = mediaStream.getVideoTracks()[0];
          updateStatus('Camera Ready (Digital Zoom)');
          applyZoom(currentZoom);
        } catch (e) {
          updateStatus('Camera Access Error: ' + e.message);
        }
      }
    }

    function switchCameraLens() {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    }

    function changeResolution(val) {
      currentResHeight = parseInt(val);
      initCamera();
    }

    function changeFPS(val) {
      currentFps = parseInt(val);
      initCamera();
    }

    function toggleScorecard() {
      isOverlayVisible = !isOverlayVisible;
      if (isOverlayVisible) {
        overlayWrapper.classList.remove('hidden');
        toggleOverlayBtn.classList.remove('inactive');
        toggleOverlayBtn.classList.add('active');
        toggleOverlayBtn.querySelector('span').innerText = 'Scorecard: ON';
      } else {
        overlayWrapper.classList.add('hidden');
        toggleOverlayBtn.classList.remove('active');
        toggleOverlayBtn.classList.add('inactive');
        toggleOverlayBtn.querySelector('span').innerText = 'Scorecard: OFF';
      }
    }

    async function applyZoom(val, btnElement = null) {
      currentZoom = parseFloat(val);
      zoomSlider.value = currentZoom;
      zoomLabel.innerText = `${currentZoom.toFixed(1)}x`;

      document.querySelectorAll('.zoom-btn').forEach(btn => {
        const btnZoom = parseFloat(btn.getAttribute('data-zoom'));
        if (btnElement) {
          btn.classList.toggle('active', btn === btnElement);
        } else {
          btn.classList.toggle('active', btnZoom === currentZoom);
        }
      });

      if (!videoTrack) return;
      const capabilities = (typeof videoTrack.getCapabilities === 'function') ? videoTrack.getCapabilities() : {};

      if (capabilities.zoom) {
        try {
          const targetZoom = Math.min(Math.max(currentZoom, capabilities.zoom.min), capabilities.zoom.max);
          await videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
          videoEl.style.transform = 'none';
        } catch (e) {
          videoEl.style.transform = `scale(${currentZoom})`;
          videoEl.style.transformOrigin = 'center center';
        }
      } else {
        videoEl.style.transform = `scale(${currentZoom})`;
        videoEl.style.transformOrigin = 'center center';
      }
    }

    function onSliderInput(val) {
      applyZoom(val);
    }

    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      const options = { mimeType: 'video/webm;codecs=vp9' };
      
      try {
        mediaRecorder = new MediaRecorder(mediaStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(mediaStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = exportVideo;
      mediaRecorder.start(1000);

      isRecording = true;
      recordBtn.classList.add('recording');
      
      recordSeconds = 0;
      timerInterval = setInterval(() => {
        recordSeconds++;
        const hrs = String(Math.floor(recordSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((recordSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(recordSeconds % 60).padStart(2, '0');
        recordText.innerText = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder) mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('recording');
      clearInterval(timerInterval);
      recordText.innerText = 'REC';
    }

    function exportVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Cricket_Match_${new Date().toISOString().slice(0,10)}.mp4`;
      a.click();
      URL.revokeObjectURL(url);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
    });
  </script>
</body>
</html>
