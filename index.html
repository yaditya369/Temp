<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Video Recorder</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-blue: #38bdf8;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Main Container */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #000;
    }

    #sourceVideo, #hiddenIframe {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }

    #renderCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Top Header Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      width: calc(100% - 24px);
      margin-top: 12px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-blue);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn, .select-input {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .btn-record {
      background: var(--accent-red);
      border-color: transparent;
      color: #fff;
    }

    .btn-recording {
      animation: pulse 1.5s infinite;
      background: #b91c1c;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .url-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      width: 140px;
    }

    /* Zoom Quick Bar (Bottom Floating) */
    .zoom-toolbar {
      position: relative;
      z-index: 10;
      margin-bottom: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .zoom-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
    }

    .zoom-slider {
      width: 90px;
      accent-color: var(--accent-blue);
    }

    /* Modal for File Saving */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: var(--bg-dark);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      width: 90vw;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #previewVideo {
      width: 100%;
      max-height: 50vh;
      border-radius: 8px;
      background: #000;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <video id="sourceVideo" autoplay playsinline muted webkit-playsinline></video>
    <iframe id="hiddenIframe" src="about:blank"></iframe>
    <canvas id="renderCanvas"></canvas>

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <div class="brand-dot"></div>
        <span>MatchRecorder</span>
      </div>

      <div class="controls-group">
        <select id="cameraSelect" class="select-input"></select>
        <select id="fpsSelect" class="select-input">
          <option value="30">30 FPS</option>
          <option value="60" selected>60 FPS</option>
        </select>
      </div>

      <div class="controls-group">
        <input type="text" id="overlayUrl" class="url-input" placeholder="Overlay Link..." />
        <button class="btn" id="loadUrlBtn">Load</button>
      </div>

      <div class="controls-group">
        <button class="btn btn-record" id="recordBtn">
          <span id="recordText">Record</span>
        </button>
      </div>
    </div>

    <!-- Zoom Controller (Presets + Slider) -->
    <div class="zoom-toolbar">
      <button class="zoom-btn active" onclick="setZoom(1)">1x</button>
      <button class="zoom-btn" onclick="setZoom(2)">2x</button>
      <button class="zoom-btn" onclick="setZoom(4)">4x</button>
      <button class="zoom-btn" onclick="setZoom(5)">5x</button>
      <button class="zoom-btn" onclick="setZoom(10)">10x</button>
      <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="10" step="0.1" value="1">
      <span id="zoomVal" style="font-size: 11px; color: var(--text-muted);">1.0x</span>
    </div>
  </div>

  <!-- Video Export Modal -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:16px; font-weight:700;">Recording Complete</span>
        <button class="btn" id="closeModalBtn">&times;</button>
      </div>
      <video id="previewVideo" controls></video>
      <div class="modal-actions">
        <button class="btn btn-record" id="saveStorageBtn">Choose Folder to Save</button>
        <a id="downloadFallback" class="btn" style="text-decoration:none;" download="match-recording.webm">Direct Download</a>
      </div>
    </div>
  </div>

  <script>
    const sourceVideo = document.getElementById('sourceVideo');
    const renderCanvas = document.getElementById('renderCanvas');
    const ctx = renderCanvas.getContext('2d');
    const cameraSelect = document.getElementById('cameraSelect');
    const fpsSelect = document.getElementById('fpsSelect');
    const zoomSlider = document.getElementById('zoomSlider');
    const zoomVal = document.getElementById('zoomVal');
    const overlayUrlInput = document.getElementById('overlayUrl');
    const loadUrlBtn = document.getElementById('loadUrlBtn');
    const recordBtn = document.getElementById('recordBtn');
    const recordText = document.getElementById('recordText');
    const previewModal = document.getElementById('previewModal');
    const previewVideo = document.getElementById('previewVideo');
    const saveStorageBtn = document.getElementById('saveStorageBtn');
    const downloadFallback = document.getElementById('downloadFallback');
    const closeModalBtn = document.getElementById('closeModalBtn');

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let videoTrack = null;
    let recordedBlob = null;

    let overlayState = { teamA: "TEAM A", scoreA: "124/3", oversA: "14.2" };

    // Detect camera hardware
    async function getCameraDevices() {
      try {
        await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        
        cameraSelect.innerHTML = '';
        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Camera Lens ${index + 1}`;
          cameraSelect.appendChild(option);
        });

        if (videoDevices.length > 0) {
          startCamera(videoDevices[0].deviceId);
        }
      } catch (err) {
        startCamera(null);
      }
    }

    async function startCamera(deviceId) {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      const targetFps = parseInt(fpsSelect.value) || 30;
      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: "environment" } },
        audio: true
      };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        sourceVideo.srcObject = mediaStream;
        await sourceVideo.play();
        videoTrack = mediaStream.getVideoTracks()[0];
      } catch (err) {
        console.error("Camera access failed:", err);
      }
    }

    // Direct Zoom hardware application
    async function setZoom(value) {
      zoomSlider.value = value;
      zoomVal.innerText = `${value.toFixed(1)}x`;

      document.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.classList.toggle('active', parseFloat(btn.innerText) === value);
      });

      if (videoTrack && videoTrack.applyConstraints) {
        try {
          await videoTrack.applyConstraints({ advanced: [{ zoom: value }] });
        } catch (e) {
          console.warn("Hardware zoom error:", e);
        }
      }
    }

    zoomSlider.addEventListener('input', () => setZoom(parseFloat(zoomSlider.value)));
    cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));
    fpsSelect.addEventListener('change', () => startCamera(cameraSelect.value));

    // Dynamic Responsive Canvas Resizing
    function resizeCanvas() {
      renderCanvas.width = window.innerWidth;
      renderCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Loop
    function renderFrame() {
      const width = renderCanvas.width;
      const height = renderCanvas.height;

      if (sourceVideo.readyState >= sourceVideo.HAVE_CURRENT_DATA) {
        ctx.drawImage(sourceVideo, 0, 0, width, height);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);
      }

      // Draw Scorecard Overlay
      const cardW = Math.min(320, width - 40);
      const cardH = 70;
      const cardX = 20;
      const cardY = height - cardH - 80;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 10);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText(overlayState.teamA, cardX + 14, cardY + 28);

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(overlayState.scoreA, cardX + 14, cardY + 54);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 13px sans-serif';
      ctx.fillText(`Overs: ${overlayState.oversA}`, cardX + 140, cardY + 54);

      ctx.restore();
      requestAnimationFrame(renderFrame);
    }

    // Recording Controls
    recordBtn.addEventListener('click', () => {
      if (!isRecording) {
        recordedChunks = [];
        const canvasStream = renderCanvas.captureStream(30);
        if (mediaStream && mediaStream.getAudioTracks().length > 0) {
          canvasStream.addTrack(mediaStream.getAudioTracks()[0]);
        }

        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
          const videoUrl = URL.createObjectURL(recordedBlob);
          previewVideo.src = videoUrl;
          downloadFallback.href = videoUrl;
          previewModal.style.display = 'flex';
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.classList.add('btn-recording');
        recordText.innerText = 'Stop';
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('btn-recording');
        recordText.innerText = 'Record';
      }
    });

    // Native File Storage Picker (Save File Directly to Device Folder)
    saveStorageBtn.addEventListener('click', async () => {
      if (!recordedBlob) return;
      
      if ('showSaveFilePicker' in window) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: `match-recording-${Date.now()}.webm`,
            types: [{
              description: 'Video File',
              accept: { 'video/webm': ['.webm'] },
            }],
          });
          const writable = await handle.createWritable();
          await writable.write(recordedBlob);
          await writable.close();
          alert("Video successfully saved to chosen storage location!");
        } catch (err) {
          console.warn("Save cancelled or not supported:", err);
        }
      } else {
        // Fallback to auto-download trigger
        downloadFallback.click();
      }
    });

    closeModalBtn.addEventListener('click', () => {
      previewModal.style.display = 'none';
    });

    getCameraDevices();
    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
