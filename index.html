<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricket Match Recorder (Landscape)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    /* Fullscreen Camera Container */
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    /* Top Control Bar */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .left-controls, .right-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-toggle.active {
      background: rgba(16, 185, 129, 0.85);
      border-color: #34d399;
    }

    .btn-toggle.inactive {
      background: rgba(239, 68, 68, 0.85);
      border-color: #f87171;
    }

    .record-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
      cursor: pointer;
    }

    .record-btn.recording {
      background: #dc2626;
      animation: pulse 1.5s infinite;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Scorecard Overlay Box - Placed cleanly in Top-Left in Landscape */
    #overlay-wrapper {
      position: absolute;
      top: 68px;
      left: 16px;
      width: clamp(320px, 45vw, 600px);
      height: 130px;
      z-index: 30;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease;
    }

    #overlay-wrapper.hidden {
      display: none;
    }

    #overlay-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* Bottom Control Bar - Zoom Controls */
    .bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 4px 8px;
      display: flex;
      gap: 6px;
      backdrop-filter: blur(8px);
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    /* Portrait Rotation Warning */
    #landscape-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    #landscape-warning svg {
      width: 64px;
      height: 64px;
      fill: #38bdf8;
      margin-bottom: 16px;
      animation: rotateHint 2s infinite ease-in-out;
    }

    @keyframes rotateHint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    @media screen and (orientation: portrait) {
      #landscape-warning {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Force Landscape Orientation Notice -->
  <div id="landscape-warning">
    <svg viewBox="0 0 24 24">
      <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
    </svg>
    <h2>Rotate Device</h2>
    <p style="color: #94a3b8; margin-top: 8px; font-size: 14px;">
      Please rotate your screen to Landscape mode to use the match recorder.
    </p>
  </div>

  <div id="app-container">
    <!-- Camera Feed -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Top Navigation Control Bar -->
    <div class="top-bar">
      <div class="left-controls">
        <button id="toggle-overlay-btn" class="btn btn-toggle active" onclick="toggleScorecard()">
          <span>Scorecard: ON</span>
        </button>
        <button id="switch-cam-btn" class="btn" onclick="switchCamera()">
          🔄 Flip Camera
        </button>
      </div>

      <div class="right-controls">
        <button id="record-btn" class="record-btn" onclick="toggleRecording()">
          <span class="rec-dot"></span>
          <span id="record-text">REC</span>
        </button>
      </div>
    </div>

    <!-- Direct Embedded CricClubs Scorecard Overlay -->
    <div id="overlay-wrapper">
      <iframe 
        id="overlay-frame" 
        src="https://cricclubs.com/nacltennisballcricket/overlay.do?matchId=4608&clubId=27594"
        allow="autoplay"
      ></iframe>
    </div>

    <!-- Bottom Zoom Controls -->
    <div class="bottom-bar">
      <button class="zoom-btn active" onclick="setZoom(1, this)">1x</button>
      <button class="zoom-btn" onclick="setZoom(2, this)">2x</button>
      <button class="zoom-btn" onclick="setZoom(3, this)">3x</button>
      <button class="zoom-btn" onclick="setZoom(5, this)">5x</button>
    </div>
  </div>

  <script>
    let videoTrack = null;
    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let currentFacingMode = 'environment';
    let isOverlayVisible = true;
    let timerInterval = null;
    let recordSeconds = 0;

    const videoEl = document.getElementById('camera-feed');
    const recordBtn = document.getElementById('record-btn');
    const recordText = document.getElementById('record-text');
    const overlayWrapper = document.getElementById('overlay-wrapper');
    const toggleOverlayBtn = document.getElementById('toggle-overlay-btn');

    async function initCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: true
      };

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoEl.srcObject = mediaStream;
        videoTrack = mediaStream.getVideoTracks()[0];
      } catch (err) {
        alert('Could not access camera hardware: ' + err.message);
      }
    }

    async function switchCamera() {
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      await initCamera();
    }

    function toggleScorecard() {
      isOverlayVisible = !isOverlayVisible;
      if (isOverlayVisible) {
        overlayWrapper.classList.remove('hidden');
        toggleOverlayBtn.classList.remove('inactive');
        toggleOverlayBtn.classList.add('active');
        toggleOverlayBtn.querySelector('span').innerText = 'Scorecard: ON';
      } else {
        overlayWrapper.classList.add('hidden');
        toggleOverlayBtn.classList.remove('active');
        toggleOverlayBtn.classList.add('inactive');
        toggleOverlayBtn.querySelector('span').innerText = 'Scorecard: OFF';
      }
    }

    async function setZoom(zoomValue, btnElement) {
      document.querySelectorAll('.zoom-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      if (!videoTrack) return;
      const capabilities = videoTrack.getCapabilities();

      if (capabilities.zoom) {
        try {
          const targetZoom = Math.min(Math.max(zoomValue, capabilities.zoom.min), capabilities.zoom.max);
          await videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
        } catch (e) {
          console.error('Hardware zoom error:', e);
        }
      } else {
        videoEl.style.transform = `scale(${zoomValue})`;
        videoEl.style.transformOrigin = 'center center';
      }
    }

    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      const options = { mimeType: 'video/webm;codecs=vp9' };
      
      try {
        mediaRecorder = new MediaRecorder(mediaStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(mediaStream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = exportVideo;
      mediaRecorder.start(1000);

      isRecording = true;
      recordBtn.classList.add('recording');
      
      recordSeconds = 0;
      timerInterval = setInterval(() => {
        recordSeconds++;
        const hrs = String(Math.floor(recordSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((recordSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(recordSeconds % 60).padStart(2, '0');
        recordText.innerText = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder) mediaRecorder.stop();
      isRecording = false;
      recordBtn.classList.remove('recording');
      clearInterval(timerInterval);
      recordText.innerText = 'REC';
    }

    function exportVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Cricket_Match_${new Date().toISOString().slice(0,10)}.mp4`;
      a.click();
      URL.revokeObjectURL(url);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
    });
  </script>
</body>
</html>
