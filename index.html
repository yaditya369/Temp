<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricket Match Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0f19;
      overflow: hidden;
    }

    /* Video Feed Styling */
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* On-Screen Status / Error Banner */
    #status-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 16px 24px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      color: #cbd5e1;
      max-width: 85%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #status-msg.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Top Control Bar */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .left-controls, .right-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn, select.btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      outline: none;
    }

    .btn-icon {
      padding: 8px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
    }

    .btn-icon svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-toggle.active {
      background: rgba(16, 185, 129, 0.85);
      border-color: #34d399;
    }

    .btn-toggle.inactive {
      background: rgba(239, 68, 68, 0.85);
      border-color: #f87171;
    }

    .record-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
      cursor: pointer;
    }

    .record-btn.recording {
      background: #dc2626;
      animation: pulse 1.5s infinite;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Scorecard Overlay Box */
    #overlay-wrapper {
      position: absolute;
      z-index: 50;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    /* Landscape Scorecard Positioning */
    @media (orientation: landscape) {
      #overlay-wrapper {
        top: 64px;
        left: 12px;
        width: clamp(320px, 40vw, 550px);
        height: 120px;
      }
    }

    /* Portrait Scorecard Positioning */
    @media (orientation: portrait) {
      #overlay-wrapper {
        top: 68px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100vw - 24px);
        height: 110px;
      }
    }

    #overlay-wrapper.hidden {
      display: none;
    }

    #overlay-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    /* Bottom Control Bar - Zoom Options + Slider */
    .bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      max-width: calc(100vw - 24px);
      overflow-x: auto;
    }

    .zoom-presets {
      display: flex;
      gap: 4px;
    }

    .zoom-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .zoom-btn.active {
      background: #38bdf8;
      color: #0f172a;
    }

    .zoom-slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      padding-left: 10px;
    }

    .zoom-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      outline: none;
    }

    .zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
    }

    .zoom-slider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      border: none;
    }

    #zoom-label {
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      min-width: 32px;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Camera Feed -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- On-screen Camera Status Message -->
    <div id="status-msg">Requesting camera access...</div>

    <!-- Top Controls Bar -->
    <div class="top-bar">
      <div class="left-controls">
        <!-- Toggle Scorecard ON/OFF -->
        <button id="toggle-overlay-btn" class="btn btn-toggle active" onclick="toggleScorecard()">
          <span>Scorecard: ON</span>
        </button>

        <!-- Lens / Camera Device Selection Dropdown -->
        <select id="camera-select" class="btn" onchange="changeCameraDevice(this.value)">
          <option value="environment">Back Camera</option>
          <option value="user">Front Camera</option>
        </select>

        <!-- Flip Camera Quick Icon Button -->
        <button class="btn btn-icon" onclick="switchCameraLens()" title="Quick Switch Lens">
          <svg viewBox="0 0 24 24">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>

        <!-- Resolution Selector -->
        <select id="resolution-select" class="btn" onchange="changeResolution(this.value)">
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="2160">4K</option>
        </select>

        <!-- FPS Selector -->
        <select id="fps-select" class="btn" onchange="changeFPS(this.value)">
          <option value="30">30 FPS</option>
          <option value="60">60 FPS</option>
          <option value="24">24 FPS</option>
        </select>
      </div>

      <div class="right-controls">
        <!-- Record Button -->
        <button id="record-btn" class="record-btn" onclick="toggleRecording()">
          <span class="rec-dot"></span>
          <span id="record-text">REC</span>
        </button>
      </div>
    </div>

    <!-- Embedded Scorecard Overlay -->
    <div id="overlay-wrapper">
      <iframe 
        id="overlay-frame" 
        src="https://cricclubs.com/nacltennisballcricket/overlay.do?matchId=4608&clubId=27594"
        allow="autoplay"
      ></iframe>
    </div>

    <!-- Bottom Zoom Controls: Presets (1x, 2x, 4x, 5x, 10x) + Slider -->
    <div class="bottom-bar">
      <div class="zoom-presets">
        <button class="zoom-btn active" data-zoom="1" onclick="applyZoom(1, this)">1x</button>
        <button class="zoom-btn" data-zoom="2" onclick="applyZoom(2, this)">2x</button>
        <button class="zoom-btn" data-zoom="4" onclick="applyZoom(4, this)">4x</button>
        <button class="zoom-btn" data-zoom="5" onclick="applyZoom(5, this)">5x</button>
        <button class="zoom-btn" data-zoom="10" onclick="applyZoom(10, this)">10x</button>
      </div>

      <div class="zoom-slider-container">
        <input 
          type="range" 
          id="zoom-slider" 
          class="zoom-slider" 
          min="1" 
          max="10" 
          step="0.1" 
          value="1" 
          oninput="onSliderInput(this.value)"
        >
        <span id="zoom-label">1.0x</span>
      </div>
    </div>
  </div>

  <script>
    let videoTrack = null;
    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let currentFacingMode = 'environment';
    let currentDeviceId = null;
    let currentResHeight = 1080;
    let currentFps = 30;
    let isOverlayVisible = true;
    let timerInterval = null;
    let recordSeconds = 0;
    let currentZoom = 1;

    const videoEl = document.getElementById('camera-feed');
    const statusMsg = document.getElementById('status-msg');
    const recordBtn = document.getElementById('record-btn');
    const recordText = document.getElementById('record-text');
    const overlayWrapper = document.getElementById('overlay-wrapper');
    const toggleOverlayBtn = document.getElementById('toggle-overlay-btn');
    const cameraSelect = document.getElementById('camera-select');
    const zoomSlider = document.getElementById('zoom-slider');
    const zoomLabel = document.getElementById('zoom-label');

    function updateStatus(message, isError = false) {
      if (!message) {
        statusMsg.classList.add('hidden');
      } else {
        statusMsg.innerText = message;
        statusMsg.style.color = isError ? '#f87171' : '#cbd5e1';
        statusMsg.classList.remove('hidden');
      }
    }

    async function enumerateDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        
        if (videoDevices.length > 0) {
          cameraSelect.innerHTML = '';
          videoDevices.forEach((device, idx) => {
            const opt = document.createElement('option');
            opt.value = device.deviceId;
            opt.innerText = device.label || `Camera Lens ${idx + 1}`;
            if (currentDeviceId === device.deviceId) opt.selected = true;
            cameraSelect.appendChild(opt);
          });
        }
      } catch (e) {
        console.warn('Device enumeration error:', e);
      }
    }

    async function initCamera() {
      updateStatus('Initializing camera...');

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }

      const videoConstraints = {
        height: { ideal: currentResHeight },
        width: { ideal: Math.round(currentResHeight * (16 / 9)) },
        frameRate: { ideal: currentFps }
      };

      if (currentDeviceId) {
        videoConstraints.deviceId = { exact: currentDeviceId };
      } else {
        videoConstraints.facingMode = { ideal: currentFacingMode };
      }

      try {
        // First try with ideal settings
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: videoConstraints,
          audio: true
        });
      } catch (err) {
        console.warn('Primary camera request failed, retrying basic fallback:', err);
        try {
          // Fallback to basic video without specific resolution/FPS constraints
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true
          });
        } catch (e) {
          console.error('Camera access failed completely:', e);
          updateStatus('Camera Access Denied or Unavailable. Please grant permission and refresh.', true);
          return;
        }
      }

      // Attach media stream
      videoEl.srcObject = mediaStream;
      videoTrack = mediaStream.getVideoTracks()[0];
      
      if (videoTrack) {
        const settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
        if (settings.deviceId) currentDeviceId = settings.deviceId;

        if (typeof videoTrack.getCapabilities === 'function') {
          const capabilities = videoTrack.getCapabilities();
          if (capabilities.zoom) {
            zoomSlider.min = capabilities.zoom.min || 1;
            zoomSlider.max = Math.min(capabilities.zoom.max || 10, 10);
          }
        }
      }

      updateStatus(null); // Hide status banner on success
      await enumerateDevices();
      applyZoom(currentZoom);
    }

    function changeCameraDevice(deviceId) {
      currentDeviceId = deviceId;
      initCamera();
    }

    function switchCameraLens() {
      currentDeviceId = null;
      currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
      initCamera();
    }

    function changeResolution(val) {
      currentResHeight = parseInt(val);
      initCamera();
    }

    function changeFPS(val) {
      currentFps = parseInt(val);
      initCamera();
    }

    function toggleScorecard() {
      isOverlayVisible = !isOverlayVisible;
      if (isOverlayVisible) {
        overlayWrapper.classList.remove('hidden');
        toggleOverlayBtn.classList.remove('inactive');
        toggleOverlayBtn.classList.add('active');
        toggleOverlayBtn.querySelector('span').innerText = 'Scorecard: ON';
      } else {
        overlayWrapper.classList.add('hidden');
        toggleOverlayBtn.classList.remove('active');
        toggleOverlayBtn.classList.add('inactive');
        toggleOverlayBtn.querySelector('span').innerText = 'Scorecard: OFF';
      }
    }

    async function applyZoom(val, btnElement = null) {
      currentZoom = parseFloat(val);
      zoomSlider.value = currentZoom;
      zoomLabel.innerText = `${currentZoom.toFixed(1)}x`;

      document.querySelectorAll('.zoom-btn').forEach(btn => {
        const btnZoom = parseFloat(btn.getAttribute('data-zoom'));
        if (btnElement) {
          btn.classList.toggle('active', btn === btnElement);
        } else {
          btn.classList.toggle('active', btnZoom === currentZoom);
        }
      });

      if (!videoTrack) return;
      const capabilities = (typeof videoTrack.getCapabilities === 'function') ? videoTrack.getCapabilities() : {};

      if (capabilities.zoom) {
        try {
          const targetZoom = Math.min(Math.max(currentZoom, capabilities.zoom.min), capabilities.zoom.max);
          await videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
          videoEl.style.transform = 'none';
        } catch (e) {
          videoEl.style.transform = `scale(${currentZoom})`;
          videoEl.style.transformOrigin = 'center center';
        }
      } else {
        videoEl.style.transform = `scale(${currentZoom})`;
        videoEl.style.transformOrigin = 'center center';
      }
    }

    function onSliderInput(val) {
      applyZoom(val);
    }

    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      if (!mediaStream) {
        alert('No active camera stream available to record.');
        return;
      }
      recordedChunks = [];
      const options = { mimeType: 'video/webm;codecs=vp9' };
      
      try {
        mediaRecorder = new MediaRecorder(mediaStream, options);
      } catch (e) {
        try {
          mediaRecorder = new MediaRecorder(mediaStream);
        } catch (err) {
          alert('Recording is not supported on this browser/device.');
          return;
        }
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = exportVideo;
      mediaRecorder.start(1000);

      isRecording = true;
      recordBtn.classList.add('recording');
      
      recordSeconds = 0;
      timerInterval = setInterval(() => {
        recordSeconds++;
        const hrs = String(Math.floor(recordSeconds / 3600)).padStart(2, '0');
        const mins = String(Math.floor((recordSeconds % 3600) / 60)).padStart(2, '0');
        const secs = String(recordSeconds % 60).padStart(2, '0');
        recordText.innerText = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      recordBtn.classList.remove('recording');
      clearInterval(timerInterval);
      recordText.innerText = 'REC';
    }

    function exportVideo() {
      if (recordedChunks.length === 0) return;
      const blob = new Blob(recordedChunks, { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Cricket_Match_${new Date().toISOString().slice(0,10)}.mp4`;
      a.click();
      URL.revokeObjectURL(url);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initCamera();
    });
  </script>
</body>
</html>
